group 'dev.brepsight.cad_engine'
version '1.0-SNAPSHOT'

def brepsightOcctRoot = System.getenv('BREPSIGHT_OCCT_ROOT')
def brepsightLib3mfRoot = System.getenv('BREPSIGHT_LIB3MF_ROOT')
def brepsightAssimpRoot = System.getenv('BREPSIGHT_ASSIMP_ROOT')

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.brepsight.cad_engine'
    compileSdk 35

    defaultConfig {
        minSdk 24
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
                if (brepsightOcctRoot) {
                    arguments "-DBREPSIGHT_OCCT_ROOT=${brepsightOcctRoot}"
                }
                if (brepsightLib3mfRoot) {
                    arguments "-DBREPSIGHT_LIB3MF_ROOT=${brepsightLib3mfRoot}"
                }
                if (brepsightAssimpRoot) {
                    arguments "-DBREPSIGHT_ASSIMP_ROOT=${brepsightAssimpRoot}"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // CI stages optional provider shared libraries here. Keeping this path
        // empty in source control preserves a small mesh-only developer build.
        main.jniLibs.srcDirs += 'src/main/jniLibs'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
