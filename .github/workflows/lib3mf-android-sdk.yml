name: lib3mf Android SDK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/lib3mf/**'
      - '.github/workflows/lib3mf-android-sdk.yml'

permissions:
  contents: read

concurrency:
  group: lib3mf-android-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB3MF_TAG: v2.5.0
  LIB3MF_COMMIT: 64bb454d1fcb53effa57d3cef752a10d740d41a2
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24
  NDK_VERSION: 27.3.13750724

jobs:
  build-lib3mf-sdk:
    name: Build lib3mf 2.5.0 arm64 SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout BrepSight
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache lib3mf source inputs
        uses: actions/cache@v5
        with:
          path: .build/lib3mf-android/src
          key: lib3mf-source-${{ env.LIB3MF_COMMIT }}

      - name: Build and install lib3mf Android SDK
        run: bash tool/lib3mf/build_android_sdk.sh

      - name: Package SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR=".build/lib3mf-sdk/${ANDROID_ABI}"
          tar -C "$SDK_DIR" -czf "lib3mf-${LIB3MF_TAG}-${ANDROID_ABI}.tar.gz" .
          sha256sum "lib3mf-${LIB3MF_TAG}-${ANDROID_ABI}.tar.gz" > "lib3mf-${LIB3MF_TAG}-${ANDROID_ABI}.tar.gz.sha256"

      - name: Upload lib3mf SDK
        uses: actions/upload-artifact@v4
        with:
          name: lib3mf-${{ env.LIB3MF_TAG }}-${{ env.ANDROID_ABI }}
          path: |
            lib3mf-${{ env.LIB3MF_TAG }}-${{ env.ANDROID_ABI }}.tar.gz
            lib3mf-${{ env.LIB3MF_TAG }}-${{ env.ANDROID_ABI }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
