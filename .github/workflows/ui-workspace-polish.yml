name: Apply Viewer Workspace Polish

on:
  push:
    paths:
      - '.github/workflows/ui-workspace-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.1
          fetch-depth: 0
      - name: Apply viewer workspace redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # App shell: model viewing becomes a dedicated workspace instead of a
          # nested page fighting the global navigation bar and terminal FAB.
          app_path = Path('lib/src/app.dart')
          app = app_path.read_text()
          app = replace_once(
              app,
              '      ViewerPage(modelPath: _openedPath),',
              """      ViewerPage(
        modelPath: _openedPath,
        onExitViewer: () => setState(() => _index = 0),
        onOpenCommandConsole: _openCommandConsole,
      ),""",
              'viewer constructor',
          )
          app = replace_once(
              app,
              '      body: SafeArea(child: IndexedStack(index: _index, children: pages)),',
              '      body: IndexedStack(index: _index, children: pages),',
              'outer safe area',
          )
          app = replace_once(
              app,
              """      floatingActionButton: _index == 1 && _openedPath != null
          ? FloatingActionButton.small(
              tooltip: '命令行',
              onPressed: () => unawaited(_openCommandConsole()),
              child: const Icon(Icons.terminal),
            )
          : null,
""",
              '',
              'terminal fab',
          )
          app = replace_once(
              app,
              '      bottomNavigationBar: NavigationBar(',
              '      bottomNavigationBar: _index == 1 && _openedPath != null ? null : NavigationBar(',
              'workspace global nav',
          )
          app_path.write_text(app)

          viewer_path = Path('lib/src/viewer/viewer_page.dart')
          viewer = viewer_path.read_text()
          viewer = replace_once(
              viewer,
              """class ViewerPage extends StatefulWidget {
  const ViewerPage({super.key, required this.modelPath});

  final String? modelPath;
""",
              """class ViewerPage extends StatefulWidget {
  const ViewerPage({
    super.key,
    required this.modelPath,
    this.onExitViewer,
    this.onOpenCommandConsole,
  });

  final String? modelPath;
  final VoidCallback? onExitViewer;
  final Future<void> Function()? onOpenCommandConsole;
""",
              'viewer api',
          )
          viewer = replace_once(
              viewer,
              "  String _displayMode = 'shaded_edges';",
              "  String _displayMode = 'shaded';",
              'default display mode',
          )
          viewer = replace_once(
              viewer,
              "        _status = '已打开：${result.displayName} · ${result.formatId.toUpperCase()}$exactInfo$meshInfo$uvInfo$objectInfo$warningInfo';",
              "        _status = '${result.formatId.toUpperCase()} 已载入$exactInfo$meshInfo$uvInfo$objectInfo$warningInfo';",
              'compact loaded status',
          )

          getter_marker = '  bool get _meshEditActive => _meshEditState?.active == true;\n'
          getter_insert = r'''

  String get _modelTitle {
    final raw = _loadedPath ?? widget.modelPath;
    if (raw == null || raw.isEmpty) return '模型查看';
    final normalized = raw.replaceAll('\\', '/');
    final name = normalized.split('/').where((part) => part.isNotEmpty).lastOrNull;
    return name == null || name.isEmpty ? '模型查看' : name;
  }

  String get _modelMeta {
    if (_loadedPath == null) return '从文件页打开一个模型';
    final triangles = _triangleCount >= 1000000
        ? '${(_triangleCount / 1000000).toStringAsFixed(1)}M'
        : _triangleCount >= 1000
            ? '${(_triangleCount / 1000).toStringAsFixed(1)}k'
            : '$_triangleCount';
    return '${_loadedFormat.toUpperCase()} · $triangles 三角面${_exactGeometry ? ' · Exact B-Rep' : ''}';
  }
'''
          # Avoid Iterable.lastOrNull (not available on every Dart baseline).
          getter_insert = getter_insert.replace(
              "    final name = normalized.split('/').where((part) => part.isNotEmpty).lastOrNull;\n    return name == null || name.isEmpty ? '模型查看' : name;",
              "    final parts = normalized.split('/').where((part) => part.isNotEmpty).toList(growable: false);\n    final name = parts.isEmpty ? '' : parts.last;\n    return name.isEmpty ? '模型查看' : name;",
          )
          viewer = replace_once(viewer, getter_marker, getter_marker + getter_insert, 'viewer title getters')

          dispose_marker = '  @override\n  void dispose() {'
          methods = r'''
  Future<void> _showMeasurementTools() async {
    if (_loadedPath == null) return;
    final selected = await showModalBottomSheet<CadMeasurementMode>(
      context: context,
      showDragHandle: true,
      useSafeArea: true,
      builder: (context) => Padding(
        padding: const EdgeInsets.fromLTRB(12, 0, 12, 12),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            ListTile(
              leading: const Icon(Icons.straighten),
              title: const Text('两点距离'),
              subtitle: const Text('依次点击模型上的两个点'),
              onTap: () => Navigator.of(context).pop(CadMeasurementMode.distance),
            ),
            ListTile(
              leading: const Icon(Icons.architecture_outlined),
              title: const Text('三点角度'),
              subtitle: const Text('依次选择 A、顶点 B、C'),
              onTap: () => Navigator.of(context).pop(CadMeasurementMode.angle),
            ),
            ListTile(
              leading: const Icon(Icons.radio_button_unchecked),
              title: const Text('三点半径'),
              subtitle: const Text('选择圆或圆弧上的三个点'),
              onTap: () => Navigator.of(context).pop(CadMeasurementMode.radius),
            ),
            if (_measurementMode != CadMeasurementMode.none)
              ListTile(
                leading: const Icon(Icons.close),
                title: const Text('退出测量'),
                onTap: () => Navigator.of(context).pop(CadMeasurementMode.none),
              ),
          ],
        ),
      ),
    );
    if (selected != null && mounted) _setMeasurementMode(selected);
  }

  Future<void> _showViewOptions() async {
    var projection = _projection;
    var displayMode = _displayMode;
    await showModalBottomSheet<void>(
      context: context,
      showDragHandle: true,
      useSafeArea: true,
      builder: (context) => StatefulBuilder(
        builder: (context, modalSetState) => Padding(
          padding: const EdgeInsets.fromLTRB(20, 0, 20, 24),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              Text('视图', style: Theme.of(context).textTheme.titleLarge),
              const SizedBox(height: 18),
              Text('投影', style: Theme.of(context).textTheme.titleSmall),
              const SizedBox(height: 8),
              SegmentedButton<String>(
                segments: const [
                  ButtonSegment(value: 'perspective', icon: Icon(Icons.photo_camera_outlined), label: Text('透视')),
                  ButtonSegment(value: 'orthographic', icon: Icon(Icons.crop_square), label: Text('正交')),
                ],
                selected: {projection},
                showSelectedIcon: false,
                onSelectionChanged: (value) {
                  projection = value.first;
                  modalSetState(() {});
                  _setProjection(projection);
                },
              ),
              const SizedBox(height: 20),
              Text('显示', style: Theme.of(context).textTheme.titleSmall),
              const SizedBox(height: 8),
              SegmentedButton<String>(
                segments: const [
                  ButtonSegment(value: 'shaded', icon: Icon(Icons.view_in_ar), label: Text('实体')),
                  ButtonSegment(value: 'shaded_edges', icon: Icon(Icons.grid_on), label: Text('边线')),
                  ButtonSegment(value: 'wireframe', icon: Icon(Icons.gesture), label: Text('线框')),
                ],
                selected: {displayMode},
                showSelectedIcon: false,
                onSelectionChanged: (value) {
                  displayMode = value.first;
                  modalSetState(() {});
                  _setDisplayMode(displayMode);
                },
              ),
              const SizedBox(height: 12),
              Text(
                '高三角面模型默认使用实体着色；边线和线框作为检查模式按需开启。',
                style: Theme.of(context).textTheme.bodySmall,
              ),
            ],
          ),
        ),
      ),
    );
  }

  Future<void> _handleMoreAction(String value) async {
    switch (value) {
      case 'inspect':
        await _inspect();
      case 'objects':
        await _showObjectPresentation();
      case 'export_obj':
        await _export('obj');
      case 'export_stl':
        await _export('stl');
      case 'console':
        await widget.onOpenCommandConsole?.call();
    }
  }

'''
          if dispose_marker not in viewer:
              raise SystemExit('dispose marker missing')
          viewer = viewer.replace(dispose_marker, methods + dispose_marker, 1)

          build_start = viewer.index('  @override\n  Widget build(BuildContext context) {', viewer.index(dispose_marker))
          section_start = viewer.index('\nclass _SectionRequest', build_start)
          new_build = r'''  @override
  Widget build(BuildContext context) {
    final busy = _analyzing ||
        _splitting ||
        _exporting ||
        _importing ||
        _meshEditing ||
        (_meshEditState?.busy ?? false);
    final hasModel = _loadedPath != null;
    final measuring = _measurementMode != CadMeasurementMode.none;
    final theme = Theme.of(context);

    return Scaffold(
      appBar: AppBar(
        leading: widget.onExitViewer == null
            ? null
            : IconButton(
                tooltip: '返回文件',
                onPressed: widget.onExitViewer,
                icon: const Icon(Icons.arrow_back),
              ),
        titleSpacing: 4,
        title: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          mainAxisSize: MainAxisSize.min,
          children: [
            Text(
              _modelTitle,
              maxLines: 1,
              overflow: TextOverflow.ellipsis,
              style: theme.textTheme.titleMedium?.copyWith(fontWeight: FontWeight.w600),
            ),
            Text(
              _modelMeta,
              maxLines: 1,
              overflow: TextOverflow.ellipsis,
              style: theme.textTheme.labelSmall?.copyWith(color: theme.colorScheme.onSurfaceVariant),
            ),
          ],
        ),
        actions: [
          if (_importing)
            IconButton(
              tooltip: '取消导入',
              onPressed: () => unawaited(_cancelImport()),
              icon: const Icon(Icons.cancel_outlined),
            ),
          IconButton(
            tooltip: '适配模型',
            onPressed: _textureId == null ? null : _fitAll,
            icon: const Icon(Icons.center_focus_strong),
          ),
          IconButton(
            tooltip: '视图设置',
            onPressed: _textureId == null ? null : () => unawaited(_showViewOptions()),
            icon: const Icon(Icons.tune),
          ),
          PopupMenuButton<String>(
            tooltip: '更多',
            enabled: hasModel && !busy,
            onSelected: (value) => unawaited(_handleMoreAction(value)),
            itemBuilder: (context) => [
              PopupMenuItem(
                value: 'inspect',
                child: ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: Icon(_exactGeometry ? Icons.account_tree_outlined : Icons.fact_check_outlined),
                  title: Text(_exactGeometry ? 'CAD 信息' : '模型检查'),
                ),
              ),
              if (_objectPresentation.isNotEmpty)
                const PopupMenuItem(
                  value: 'objects',
                  child: ListTile(
                    contentPadding: EdgeInsets.zero,
                    leading: Icon(Icons.layers_outlined),
                    title: Text('对象与可见性'),
                  ),
                ),
              const PopupMenuDivider(),
              const PopupMenuItem(
                value: 'export_obj',
                child: ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: Icon(Icons.file_upload_outlined),
                  title: Text('导出 OBJ'),
                ),
              ),
              const PopupMenuItem(
                value: 'export_stl',
                child: ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: Icon(Icons.file_upload_outlined),
                  title: Text('导出 STL'),
                ),
              ),
              if (widget.onOpenCommandConsole != null) ...[
                const PopupMenuDivider(),
                const PopupMenuItem(
                  value: 'console',
                  child: ListTile(
                    contentPadding: EdgeInsets.zero,
                    leading: Icon(Icons.terminal),
                    title: Text('命令行'),
                  ),
                ),
              ],
            ],
          ),
        ],
      ),
      body: LayoutBuilder(
        builder: (context, constraints) {
          final size = Size(constraints.maxWidth, constraints.maxHeight);
          WidgetsBinding.instance.addPostFrameCallback((_) {
            unawaited(_ensureSurface(size));
          });
          return GestureDetector(
            behavior: HitTestBehavior.opaque,
            onScaleStart: measuring ? null : _onScaleStart,
            onScaleUpdate: measuring ? null : _onScaleUpdate,
            onTapUp: measuring ? _onMeasureTap : null,
            child: Stack(
              fit: StackFit.expand,
              children: [
                ColoredBox(color: theme.colorScheme.surfaceContainerLowest),
                if (_textureId != null) Texture(textureId: _textureId!),
                if (!hasModel && !_importing)
                  Center(
                    child: Padding(
                      padding: const EdgeInsets.all(32),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.view_in_ar_outlined, size: 56, color: theme.colorScheme.outline),
                          const SizedBox(height: 12),
                          Text('尚未打开模型', style: theme.textTheme.titleMedium),
                          const SizedBox(height: 4),
                          Text(
                            '返回文件页选择 STL、OBJ、STEP、IGES、3MF、3DM 等模型。',
                            textAlign: TextAlign.center,
                            style: theme.textTheme.bodyMedium?.copyWith(color: theme.colorScheme.onSurfaceVariant),
                          ),
                        ],
                      ),
                    ),
                  ),
                if (measuring || _meshEditActive || _sectionEnabled)
                  Positioned(
                    left: 12,
                    right: 12,
                    top: 12,
                    child: Align(
                      alignment: Alignment.topLeft,
                      child: Wrap(
                        spacing: 8,
                        runSpacing: 8,
                        children: [
                          if (measuring)
                            Chip(
                              avatar: const Icon(Icons.straighten, size: 18),
                              label: Text(
                                '${switch (_measurementMode) {
                                  CadMeasurementMode.distance => '距离',
                                  CadMeasurementMode.angle => '角度',
                                  CadMeasurementMode.radius => '半径',
                                  CadMeasurementMode.none => '',
                                }} · ${_measurementPoints.length} 点'
                                '${_measurementResult == null ? '' : ' · $_measurementResult'}',
                              ),
                            ),
                          if (_meshEditActive)
                            Chip(
                              avatar: const Icon(Icons.transform, size: 18),
                              label: Text('编辑工作副本 · r${_meshEditState!.cursor}'),
                            ),
                          if (_sectionEnabled)
                            Chip(
                              avatar: const Icon(Icons.content_cut, size: 18),
                              label: Text('${_sectionAxis.toUpperCase()} ≥ ${_measurementNumber(_sectionOffset)}'),
                            ),
                        ],
                      ),
                    ),
                  ),
                Positioned(
                  left: 12,
                  right: 12,
                  bottom: 12,
                  child: IgnorePointer(
                    child: Material(
                      color: theme.colorScheme.surface.withValues(alpha: 0.92),
                      elevation: 1,
                      borderRadius: BorderRadius.circular(14),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),
                        child: Row(
                          children: [
                            if (_importing || _meshEditing)
                              const Padding(
                                padding: EdgeInsets.only(right: 10),
                                child: SizedBox(
                                  width: 17,
                                  height: 17,
                                  child: CircularProgressIndicator(strokeWidth: 2),
                                ),
                              )
                            else
                              Padding(
                                padding: const EdgeInsets.only(right: 8),
                                child: Icon(Icons.info_outline, size: 17, color: theme.colorScheme.onSurfaceVariant),
                              ),
                            Expanded(
                              child: Text(
                                _status,
                                maxLines: 2,
                                overflow: TextOverflow.ellipsis,
                                style: theme.textTheme.bodySmall,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              ],
            ),
          );
        },
      ),
      bottomNavigationBar: hasModel
          ? _ViewerToolDock(
              busy: busy,
              measurementActive: measuring,
              sectionActive: _sectionEnabled,
              editActive: _meshEditActive,
              hasObjects: _objectPresentation.isNotEmpty,
              onMeasurement: () => unawaited(_showMeasurementTools()),
              onSection: () => unawaited(_showSectionControls()),
              onEdit: () => unawaited(_showMeshEditor()),
              onObjects: () => unawaited(_showObjectPresentation()),
            )
          : null,
    );
  }
}

class _ViewerToolDock extends StatelessWidget {
  const _ViewerToolDock({
    required this.busy,
    required this.measurementActive,
    required this.sectionActive,
    required this.editActive,
    required this.hasObjects,
    required this.onMeasurement,
    required this.onSection,
    required this.onEdit,
    required this.onObjects,
  });

  final bool busy;
  final bool measurementActive;
  final bool sectionActive;
  final bool editActive;
  final bool hasObjects;
  final VoidCallback onMeasurement;
  final VoidCallback onSection;
  final VoidCallback onEdit;
  final VoidCallback onObjects;

  @override
  Widget build(BuildContext context) {
    return Material(
      color: Theme.of(context).colorScheme.surface,
      elevation: 3,
      child: SafeArea(
        top: false,
        child: SizedBox(
          height: 68,
          child: Row(
            children: [
              _ViewerToolButton(
                icon: Icons.straighten,
                label: '测量',
                active: measurementActive,
                enabled: !busy,
                onTap: onMeasurement,
              ),
              _ViewerToolButton(
                icon: Icons.content_cut,
                label: '剖切',
                active: sectionActive,
                enabled: !busy && !editActive,
                onTap: onSection,
              ),
              _ViewerToolButton(
                icon: Icons.transform,
                label: '编辑',
                active: editActive,
                enabled: !busy && !sectionActive,
                onTap: onEdit,
              ),
              _ViewerToolButton(
                icon: Icons.layers_outlined,
                label: '对象',
                active: false,
                enabled: !busy && !editActive && hasObjects,
                onTap: onObjects,
              ),
            ],
          ),
        ),
      ),
    );
  }
}

class _ViewerToolButton extends StatelessWidget {
  const _ViewerToolButton({
    required this.icon,
    required this.label,
    required this.active,
    required this.enabled,
    required this.onTap,
  });

  final IconData icon;
  final String label;
  final bool active;
  final bool enabled;
  final VoidCallback onTap;

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final foreground = active ? theme.colorScheme.primary : theme.colorScheme.onSurfaceVariant;
    return Expanded(
      child: InkWell(
        onTap: enabled ? onTap : null,
        child: Opacity(
          opacity: enabled ? 1 : 0.38,
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Container(
                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 5),
                decoration: BoxDecoration(
                  color: active ? theme.colorScheme.secondaryContainer : Colors.transparent,
                  borderRadius: BorderRadius.circular(20),
                ),
                child: Icon(icon, size: 22, color: foreground),
              ),
              const SizedBox(height: 2),
              Text(label, style: theme.textTheme.labelMedium?.copyWith(color: foreground)),
            ],
          ),
        ),
      ),
    );
  }
}
'''
          viewer = viewer[:build_start] + new_build + viewer[section_start:]
          viewer_path.write_text(viewer)

          # Native renderer: neutral engineering canvas + readable shaded default.
          cpp_path = Path('packages/cad_engine/android/src/main/cpp/cad_engine_jni.cpp')
          cpp = cpp_path.read_text()
          cpp = replace_once(
              cpp,
              'constexpr brepsight::Vec3 kDefaultBaseColor{0.70f, 0.76f, 0.84f};',
              'constexpr brepsight::Vec3 kDefaultBaseColor{0.38f, 0.49f, 0.64f};',
              'default mesh color',
          )
          cpp = replace_once(cpp, '  int displayMode = 1;', '  int displayMode = 0;', 'render state default mode')
          cpp = replace_once(cpp, '    int displayMode = 1;', '    int displayMode = 0;', 'frame default mode')
          cpp = replace_once(
              cpp,
              '  vec3 shaded = uBaseColor * (0.28 + 0.72 * diffuse);',
              '  vec3 shaded = uBaseColor * (0.52 + 0.48 * diffuse);',
              'mesh lighting',
          )
          cpp = replace_once(
              cpp,
              '  vec3 edgeColor = vec3(0.055, 0.065, 0.075);',
              '  vec3 edgeColor = vec3(0.08, 0.11, 0.15);',
              'edge color',
          )
          cpp = replace_once(
              cpp,
              '    fragColor = vec4(mix(shaded, edgeColor, edge), 1.0);',
              '    fragColor = vec4(mix(shaded, edgeColor, edge * 0.55), 1.0);',
              'soft edge overlay',
          )
          cpp = replace_once(
              cpp,
              '    glClearColor(0.045f, 0.055f, 0.072f, 1.0f);',
              '    glClearColor(0.914f, 0.929f, 0.949f, 1.0f);',
              'engineering canvas background',
          )
          cpp_path.write_text(cpp)

          # The helper workflow is intentionally ephemeral.
          Path('.github/workflows/ui-workspace-polish.yml').unlink()
          PY

          git config user.name 'BrepSight CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ui: redesign mobile model workspace'
          git push origin HEAD:release/0.1
