name: Assimp Android SDK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/assimp/build_android_sdk.sh'
      - '.github/workflows/assimp-android-sdk.yml'

permissions:
  contents: read

concurrency:
  group: assimp-android-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSIMP_TAG: v6.0.5
  ASSIMP_COMMIT: 392a658f9c271be965271f45e7521a1b80ea4392
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24
  NDK_VERSION: 27.3.13750724

jobs:
  build-assimp-sdk:
    name: Build Assimp 6.0.5 arm64 SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout BrepSight
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build binutils

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Assimp source inputs
        uses: actions/cache@v5
        with:
          path: .build/assimp-android/src
          key: assimp-source-${{ env.ASSIMP_COMMIT }}

      - name: Build and install Assimp Android SDK
        run: bash tool/assimp/build_android_sdk.sh

      - name: Publish Assimp diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Assimp Android SDK diagnostics'
            for log in .build/assimp-android/logs/configure.log .build/assimp-android/logs/build.log .build/assimp-android/logs/install.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "### $(basename "$log")"
                echo '```text'
                tail -n 120 "$log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Assimp diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assimp-diagnostics-${{ github.run_number }}
          path: .build/assimp-android/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Package SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR=".build/assimp-sdk/${ANDROID_ABI}"
          tar -C "$SDK_DIR" -czf "assimp-${ASSIMP_TAG}-${ANDROID_ABI}.tar.gz" .
          sha256sum "assimp-${ASSIMP_TAG}-${ANDROID_ABI}.tar.gz" > "assimp-${ASSIMP_TAG}-${ANDROID_ABI}.tar.gz.sha256"

      - name: Upload Assimp SDK
        uses: actions/upload-artifact@v4
        with:
          name: assimp-${{ env.ASSIMP_TAG }}-${{ env.ANDROID_ABI }}
          path: |
            assimp-${{ env.ASSIMP_TAG }}-${{ env.ANDROID_ABI }}.tar.gz
            assimp-${{ env.ASSIMP_TAG }}-${{ env.ANDROID_ABI }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
