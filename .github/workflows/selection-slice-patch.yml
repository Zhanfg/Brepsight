          insertion_anchor = '''  Future<void> _showMeasurementTools() async {
'''
          insertion = '''  String _selectionName(CadSelectionFilter filter) => switch (filter) {
            CadSelectionFilter.vertex => '顶点',
            CadSelectionFilter.edge => '边',
            CadSelectionFilter.face => '面',
            CadSelectionFilter.body => '对象',
