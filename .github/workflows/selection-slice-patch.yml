                      title: Text('选择过滤'),
                      subtitle: Text('只允许目标特征被选中；高亮保持在 native 3D 视图中'),
                    ),
                    for (final item in const <(String, String, IconData)>[
                      ('vertex', '顶点', Icons.circle_outlined),
                      ('edge', '边', Icons.horizontal_rule),
                      ('face', '面', Icons.change_history_outlined),
