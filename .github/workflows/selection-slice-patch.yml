            considerSnap(midpoint(v1, v2), kSnapEdgeMidpoint, 1);
            considerSnap(midpoint(v2, v0), kSnapEdgeMidpoint, 2);
            considerSnap(centroid(v0, v1, v2), kSnapFaceCenter, 0);

