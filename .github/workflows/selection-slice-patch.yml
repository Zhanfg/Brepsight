''')
          replace_once(path, '''  bool get _measuring => _measureMode != _MeasureMode.none;
            bool get _busy =>
''', '''  bool get _measuring => _measureMode != _MeasureMode.none;
            CadObjectPresentation? get _selectedObject {
              final index = _selection?.objectIndex ?? -1;
