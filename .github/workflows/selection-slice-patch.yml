name: Selection slice patch runner

on:
  push:
    branches: [automation/selection-slice-20260819]

permissions:
  contents: write

jobs:
  patch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Patch native selection, filters, properties and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
