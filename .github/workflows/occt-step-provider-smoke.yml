name: OCCT STEP Provider Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/cad_engine/android/src/main/cpp/step_occt_importer.*'
      - 'packages/cad_engine/android/src/main/cpp/CMakeLists.txt'
      - 'tool/occt/provider_smoke/**'
      - '.github/workflows/occt-step-provider-smoke.yml'
  workflow_run:
    workflows: ['OCCT Android SDK']
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  OCCT_TAG: V8_0_0
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24
  NDK_VERSION: 27.3.13750724

jobs:
  smoke:
    name: Compile STEP/XCAF provider
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout BrepSight
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Download latest successful OCCT SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow occt-android-sdk.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo 'No successful OCCT Android SDK run on main yet.' >&2
            exit 2
          fi
          mkdir -p .build/occt-artifact .build/occt-consume/sdk
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "occt-${OCCT_TAG}-${ANDROID_ABI}" \
            --dir .build/occt-artifact
          TARBALL="$(find .build/occt-artifact -type f -name 'occt-*.tar.gz' -print -quit)"
          test -n "$TARBALL"
          tar -xzf "$TARBALL" -C .build/occt-consume/sdk
          echo "BREPSIGHT_OCCT_ROOT=$PWD/.build/occt-consume/sdk" >> "$GITHUB_ENV"
          echo "BREPSIGHT_OCCT_SDK_RUN=$RUN_ID" >> "$GITHUB_ENV"

      - name: Configure STEP provider smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/occt-smoke-logs
          cmake -S tool/occt/provider_smoke -B .build/occt-provider-smoke -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBREPSIGHT_OCCT_ROOT="$BREPSIGHT_OCCT_ROOT" \
            2>&1 | tee .build/occt-smoke-logs/configure.log

      - name: Compile and link STEP provider smoke
        shell: bash
        run: |
          set -o pipefail
          cmake --build .build/occt-provider-smoke --verbose --parallel \
            2>&1 | tee .build/occt-smoke-logs/build.log

      - name: Verify provider shared object
        shell: bash
        run: |
          set -euo pipefail
          SO="$(find .build/occt-provider-smoke -type f -name 'libbrepsight_occt_provider_smoke.so' -print -quit)"
          test -n "$SO"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$SO" \
            | tee .build/occt-smoke-logs/readelf.txt
          echo "sdkRun=${BREPSIGHT_OCCT_SDK_RUN}" > .build/occt-smoke-logs/build-info.txt

      - name: Upload STEP provider smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt-step-provider-smoke-${{ github.run_number }}
          path: .build/occt-smoke-logs/
          if-no-files-found: warn
          retention-days: 14
