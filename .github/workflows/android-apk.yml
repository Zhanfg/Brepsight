name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run native mesh importer tests
        shell: bash
        run: |
          set -euo pipefail
          CPP_DIR="packages/cad_engine/android/src/main/cpp"
          TEST_DIR="packages/cad_engine/android/src/test/cpp"

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/stl_importer.cpp" \
            "${TEST_DIR}/stl_importer_test.cpp" \
            -o /tmp/brepsight_stl_importer_test
          /tmp/brepsight_stl_importer_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/obj_importer.cpp" \
            "${TEST_DIR}/obj_importer_test.cpp" \
            -o /tmp/brepsight_obj_importer_test
          /tmp/brepsight_obj_importer_test

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
          pub-cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_flutter.sh

      - name: Run tests when present
        shell: bash
        run: |
          if find test packages -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Dart tests found yet; skipping flutter test.'
          fi

      - name: Build debug APK
        run: flutter build apk --debug --build-number "${GITHUB_RUN_NUMBER}"

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="BrepSight-${GITHUB_RUN_NUMBER}-${SHORT_SHA}-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: brepsight-apk-${{ github.run_number }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
