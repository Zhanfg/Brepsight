name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_SHA" = "$EXPECTED_SOURCE_SHA" || {
            echo "Source identity mismatch: checked out $CHECKED_OUT_SHA, expected $EXPECTED_SOURCE_SHA" >&2
            exit 2
          }
          echo "BREPSIGHT_SOURCE_SHA=$CHECKED_OUT_SHA" >> "$GITHUB_ENV"
          echo "Verified exact source head: $CHECKED_OUT_SHA"

      - name: One-shot fix measurement HUD overlap
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/0.1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('lib/src/viewer/engineering_workspace_page.dart')
          text = page.read_text()
          start_marker = '                if (_measuring || _editActive || _sectionEnabled)\n'
          end_marker = '                if (_precisionPick && _measuring)\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''                if (_measuring || _editActive || _sectionEnabled)
                  Positioned(
                    left: 12,
                    right: 12,
                    top: 12,
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Wrap(
                          spacing: 8,
                          runSpacing: 8,
                          children: [
                            if (_measuring)
                              Chip(
                                avatar: const Icon(Icons.straighten, size: 18),
                                label: Text(
                                  '${_measureName(_measureMode)} · '
                                  '${_measurePoints.length} 点'
                                  '${_precisionPick ? ' · 精确' : ''}'
                                  '${_measureResult == null ? '' : ' · $_measureResult'}',
                                ),
                              ),
                            if (_editActive)
                              Chip(
                                avatar: const Icon(Icons.transform, size: 18),
                                label: Text('工作副本 · r${_editState!.cursor}'),
                              ),
                            if (_sectionEnabled)
                              Chip(
                                avatar: const Icon(Icons.content_cut, size: 18),
                                label: Text(
                                  '${_sectionAxis.toUpperCase()} ≥ '
                                  '${_number(_sectionOffset)}',
                                ),
                              ),
                          ],
                        ),
                        if (_measuring) ...[
                          const SizedBox(height: 8),
                          ConstrainedBox(
                            constraints: BoxConstraints(maxWidth: statusWidth),
                            child: Material(
                              color: theme.colorScheme.surface.withValues(alpha: 0.92),
                              elevation: 1,
                              borderRadius: BorderRadius.circular(12),
                              child: Padding(
                                padding: const EdgeInsets.symmetric(
                                  horizontal: 11,
                                  vertical: 8,
                                ),
                                child: Row(
                                  children: [
                                    Padding(
                                      padding: const EdgeInsets.only(right: 7),
                                      child: Icon(
                                        Icons.info_outline,
                                        size: 16,
                                        color: theme.colorScheme.onSurfaceVariant,
                                      ),
                                    ),
                                    Expanded(
                                      child: Text(
                                        _status,
                                        maxLines: 2,
                                        overflow: TextOverflow.ellipsis,
                                        style: theme.textTheme.bodySmall,
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ),
                        ],
                        if (_lastPick != null && _measuring) ...[
                          const SizedBox(height: 8),
                          Align(
                            alignment: Alignment.centerRight,
                            child: SizedBox(
                              width: constraints.maxWidth < 380 ? 238 : 270,
                              child: _pickCard(theme, _lastPick!),
                            ),
                          ),
                        ],
                      ],
                    ),
                  ),
'''
          text = text[:start] + replacement + text[end:]
          old_bottom = '''                Positioned(
                  left: 12,
                  bottom: 12,
                  width: statusWidth,
'''
          new_bottom = '''                if (!_measuring)
                  Positioned(
                    left: 12,
                    bottom: 12,
                    width: statusWidth,
'''
          if old_bottom not in text:
              raise SystemExit('bottom status anchor not found')
          page.write_text(text.replace(old_bottom, new_bottom, 1))

          test = Path('test/viewer_workspace_test.dart')
          t = test.read_text()
          anchor = '''    expect(find.text('捕捉中心'), findsOneWidget);
    await tester.tap(find.text('捕捉中心'));
'''
          replacement_test = '''    expect(find.text('捕捉中心'), findsOneWidget);
    expect(find.text('坐标测量 · 选择 1 个点'), findsOneWidget);
    final statusRect = tester.getRect(find.text('坐标测量 · 选择 1 个点'));
    final captureRect = tester.getRect(find.text('捕捉中心'));
    expect(statusRect.bottom, lessThan(captureRect.top));

    await tester.tap(find.text('捕捉中心'));
'''
          if anchor not in t:
              raise SystemExit('measurement regression anchor not found')
          test.write_text(t.replace(anchor, replacement_test, 1))
          PY

          dart format lib/src/viewer/engineering_workspace_page.dart test/viewer_workspace_test.dart || true
          git show HEAD^:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml
          rm -f .github/workflows/one-shot-fix-measurement-hud.yml
          git config user.name 'brepsight-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/viewer/engineering_workspace_page.dart test/viewer_workspace_test.dart .github/workflows/android-apk.yml .github/workflows/one-shot-fix-measurement-hud.yml
          git diff --cached --check
          git commit -m 'fix(viewer): keep measurement HUD clear of precision controls'
          git push origin HEAD:release/0.1

      - name: Run native mesh core tests
        shell: bash
        run: |
          set -euo pipefail
          CPP_DIR="packages/cad_engine/android/src/main/cpp"
          TEST_DIR="packages/cad_engine/android/src/test/cpp"
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/stl_importer.cpp" "${TEST_DIR}/stl_importer_test.cpp" -o /tmp/brepsight_stl_importer_test
          /tmp/brepsight_stl_importer_test
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/obj_importer.cpp" "${TEST_DIR}/obj_importer_test.cpp" -o /tmp/brepsight_obj_importer_test
          /tmp/brepsight_obj_importer_test
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/stl_importer.cpp" "${CPP_DIR}/obj_importer.cpp" "${CPP_DIR}/mesh_writer.cpp" "${TEST_DIR}/mesh_writer_test.cpp" -o /tmp/brepsight_mesh_writer_test
          /tmp/brepsight_mesh_writer_test
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/mesh_analysis.cpp" "${TEST_DIR}/mesh_analysis_test.cpp" -o /tmp/brepsight_mesh_analysis_test
          /tmp/brepsight_mesh_analysis_test
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/mesh_components.cpp" "${TEST_DIR}/mesh_components_test.cpp" -o /tmp/brepsight_mesh_components_test
          /tmp/brepsight_mesh_components_test
          g++ -std=c++20 -Wall -Wextra -Werror -I"${CPP_DIR}" "${CPP_DIR}/mesh_merge.cpp" "${TEST_DIR}/mesh_merge_test.cpp" -o /tmp/brepsight_mesh_merge_test
          /tmp/brepsight_mesh_merge_test
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -I"${CPP_DIR}" "${CPP_DIR}/section_filter.cpp" "${TEST_DIR}/section_filter_test.cpp" -o /tmp/brepsight_section_filter_test
          /tmp/brepsight_section_filter_test

      - name: Stage latest OCCT SDK when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/stage_occt_sdk.sh

      - name: Stage latest lib3mf SDK when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/stage_lib3mf_sdk.sh

      - name: Stage latest Assimp SDK when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/stage_assimp_sdk.sh

      - name: Stage latest openNURBS SDK when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/stage_opennurbs_sdk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
          pub-cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_flutter.sh

      - name: Run Dart and Android plugin tests
        shell: bash
        run: |
          set -euo pipefail
          if find test packages -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Dart tests found yet; skipping flutter test.'
          fi
          (cd android && ./gradlew :cad_engine:testDebugUnitTest --stacktrace)

      - name: Build debug APK
        shell: bash
        run: |
          flutter build apk --debug \
            --target-platform android-arm64 \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define="BREPSIGHT_OCCT_ENABLED=${BREPSIGHT_OCCT_ENABLED:-false}" \
            --dart-define="BREPSIGHT_OCCT_VERSION=8.0.0" \
            --dart-define="BREPSIGHT_LIB3MF_ENABLED=${BREPSIGHT_LIB3MF_ENABLED:-false}" \
            --dart-define="BREPSIGHT_LIB3MF_VERSION=2.5.0" \
            --dart-define="BREPSIGHT_ASSIMP_ENABLED=${BREPSIGHT_ASSIMP_ENABLED:-false}" \
            --dart-define="BREPSIGHT_ASSIMP_VERSION=6.0.5" \
            --dart-define="BREPSIGHT_OPENNURBS_ENABLED=${BREPSIGHT_OPENNURBS_ENABLED:-false}" \
            --dart-define="BREPSIGHT_OPENNURBS_VERSION=8.32"

      - name: Verify APK native provider payload
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          unzip -l "$APK" > /tmp/brepsight-apk-files.txt
          grep -q 'lib/arm64-v8a/libcad_engine.so' /tmp/brepsight-apk-files.txt
          if grep -q 'lib/armeabi-v7a/' /tmp/brepsight-apk-files.txt; then
            echo 'Unexpected 32-bit native libraries found in arm64 provider APK:' >&2
            grep 'lib/armeabi-v7a/' /tmp/brepsight-apk-files.txt >&2 || true
            exit 2
          fi
          if grep -Eq 'lib/(armeabi|x86|x86_64)/' /tmp/brepsight-apk-files.txt; then
            echo 'Unexpected non-arm64 native libraries found in arm64 provider APK:' >&2
            grep -E 'lib/(armeabi|x86|x86_64)/' /tmp/brepsight-apk-files.txt >&2 || true
            exit 2
          fi
          if [[ "${BREPSIGHT_LIB3MF_ENABLED:-false}" == "true" ]]; then grep -q 'lib/arm64-v8a/lib3mf.so' /tmp/brepsight-apk-files.txt; fi
          if [[ "${BREPSIGHT_ASSIMP_ENABLED:-false}" == "true" ]]; then
            grep -q 'lib/arm64-v8a/libassimp.so' /tmp/brepsight-apk-files.txt
            unzip -p "$APK" lib/arm64-v8a/libcad_engine.so > /tmp/libcad_engine.so
            readelf -d /tmp/libcad_engine.so | grep -Fq 'Shared library: [libassimp.so]'
            unzip -p "$APK" lib/arm64-v8a/libassimp.so > /tmp/libassimp.so
            readelf -d /tmp/libassimp.so | grep -Fq 'Library soname: [libassimp.so]'
          fi
          if [[ "${BREPSIGHT_OPENNURBS_ENABLED:-false}" == "true" ]]; then
            grep -q 'lib/arm64-v8a/libOpenNURBS.so' /tmp/brepsight-apk-files.txt
            unzip -p "$APK" lib/arm64-v8a/libcad_engine.so > /tmp/libcad_engine.so
            readelf -d /tmp/libcad_engine.so | grep -Fq 'Shared library: [libOpenNURBS.so]'
          fi

      - name: Verify arm64 native payload
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          unzip -l "$APK" > /tmp/brepsight-apk-files.txt
          grep -q 'lib/arm64-v8a/libcad_engine.so' /tmp/brepsight-apk-files.txt
          ! grep -Eq 'lib/(armeabi|armeabi-v7a|x86|x86_64)/' /tmp/brepsight-apk-files.txt

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          : "${BREPSIGHT_SOURCE_SHA:?Exact source identity was not established}"
          SHORT_SHA="${BREPSIGHT_SOURCE_SHA::7}"
          PROVIDERS=()
          if [[ "${BREPSIGHT_OCCT_ENABLED:-false}" == "true" ]]; then PROVIDERS+=(occt); fi
          if [[ "${BREPSIGHT_LIB3MF_ENABLED:-false}" == "true" ]]; then PROVIDERS+=(3mf); fi
          if [[ "${BREPSIGHT_ASSIMP_ENABLED:-false}" == "true" ]]; then PROVIDERS+=(assimp); fi
          if [[ "${BREPSIGHT_OPENNURBS_ENABLED:-false}" == "true" ]]; then PROVIDERS+=(3dm); fi
          if [[ ${#PROVIDERS[@]} -eq 0 ]]; then PROVIDER_SUFFIX="mesh"; else PROVIDER_SUFFIX="$(IFS=-; echo "${PROVIDERS[*]}")"; fi
          APK_NAME="BrepSight-0.1-${GITHUB_RUN_NUMBER}-${SHORT_SHA}-${PROVIDER_SUFFIX}-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          cat > dist/build-info.txt <<EOF
          version=0.1.0
          commit=${BREPSIGHT_SOURCE_SHA}
          eventCommit=${GITHUB_SHA}
          run=${GITHUB_RUN_NUMBER}
          abi=arm64-v8a
          occtEnabled=${BREPSIGHT_OCCT_ENABLED:-false}
          occtVersion=8.0.0
          occtSdkRun=${BREPSIGHT_OCCT_RUN_ID:-}
          lib3mfEnabled=${BREPSIGHT_LIB3MF_ENABLED:-false}
          lib3mfVersion=2.5.0
          lib3mfSdkRun=${BREPSIGHT_LIB3MF_RUN_ID:-}
          assimpEnabled=${BREPSIGHT_ASSIMP_ENABLED:-false}
          assimpVersion=6.0.5
          assimpSdkRun=${BREPSIGHT_ASSIMP_RUN_ID:-}
          openNurbsEnabled=${BREPSIGHT_OPENNURBS_ENABLED:-false}
          openNurbsVersion=8.32
          openNurbsSdkRun=${BREPSIGHT_OPENNURBS_RUN_ID:-}
          EOF
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: brepsight-apk-${{ github.run_number }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14
