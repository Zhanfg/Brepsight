name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run native mesh core tests
        shell: bash
        run: |
          set -euo pipefail
          CPP_DIR="packages/cad_engine/android/src/main/cpp"
          TEST_DIR="packages/cad_engine/android/src/test/cpp"

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/stl_importer.cpp" \
            "${TEST_DIR}/stl_importer_test.cpp" \
            -o /tmp/brepsight_stl_importer_test
          /tmp/brepsight_stl_importer_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/obj_importer.cpp" \
            "${TEST_DIR}/obj_importer_test.cpp" \
            -o /tmp/brepsight_obj_importer_test
          /tmp/brepsight_obj_importer_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/stl_importer.cpp" \
            "${CPP_DIR}/obj_importer.cpp" \
            "${CPP_DIR}/mesh_writer.cpp" \
            "${TEST_DIR}/mesh_writer_test.cpp" \
            -o /tmp/brepsight_mesh_writer_test
          /tmp/brepsight_mesh_writer_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/mesh_analysis.cpp" \
            "${TEST_DIR}/mesh_analysis_test.cpp" \
            -o /tmp/brepsight_mesh_analysis_test
          /tmp/brepsight_mesh_analysis_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/mesh_components.cpp" \
            "${TEST_DIR}/mesh_components_test.cpp" \
            -o /tmp/brepsight_mesh_components_test
          /tmp/brepsight_mesh_components_test

          g++ -std=c++20 -Wall -Wextra -Werror \
            -I"${CPP_DIR}" \
            "${CPP_DIR}/mesh_merge.cpp" \
            "${TEST_DIR}/mesh_merge_test.cpp" \
            -o /tmp/brepsight_mesh_merge_test
          /tmp/brepsight_mesh_merge_test

      - name: Stage latest OCCT SDK when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/stage_occt_sdk.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
          pub-cache: true

      - name: Prepare Android project
        run: bash tool/bootstrap_flutter.sh

      - name: Run tests when present
        shell: bash
        run: |
          if find test packages -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Dart tests found yet; skipping flutter test.'
          fi

      - name: Build debug APK
        shell: bash
        run: |
          flutter build apk --debug \
            --target-platform android-arm64 \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define="BREPSIGHT_OCCT_ENABLED=${BREPSIGHT_OCCT_ENABLED:-false}" \
            --dart-define="BREPSIGHT_OCCT_VERSION=8.0.0"

      - name: Verify arm64 native payload
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          unzip -l "$APK" > /tmp/brepsight-apk-files.txt
          grep -q 'lib/arm64-v8a/libcad_engine.so' /tmp/brepsight-apk-files.txt
          if grep -q 'lib/armeabi-v7a/' /tmp/brepsight-apk-files.txt; then
            echo 'Unexpected 32-bit native libraries found in arm64 APK.' >&2
            exit 2
          fi
          echo 'Verified arm64-v8a native payload.'

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          PROVIDER_SUFFIX="mesh"
          if [[ "${BREPSIGHT_OCCT_ENABLED:-false}" == "true" ]]; then
            PROVIDER_SUFFIX="occt"
          fi
          APK_NAME="BrepSight-${GITHUB_RUN_NUMBER}-${SHORT_SHA}-${PROVIDER_SUFFIX}-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          cat > dist/build-info.txt <<EOF
          commit=${GITHUB_SHA}
          run=${GITHUB_RUN_NUMBER}
          abi=arm64-v8a
          occtEnabled=${BREPSIGHT_OCCT_ENABLED:-false}
          occtVersion=8.0.0
          occtSdkRun=${BREPSIGHT_OCCT_RUN_ID:-}
          EOF
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: brepsight-apk-${{ github.run_number }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14
