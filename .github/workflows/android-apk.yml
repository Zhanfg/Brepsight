name: Android APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-viewer-ui:
    name: Apply viewer workspace redesign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout release head
        uses: actions/checkout@v6
        with:
          ref: release/0.1
          fetch-depth: 2

      - name: Apply deterministic UI migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/ui/apply_viewer_polish.py')
          text = path.read_text()
          old = """cpp = replace_once(cpp, '  int displayMode = 1;', '  int displayMode = 0;', 'render default mode')
cpp = replace_once(cpp, '    int displayMode = 1;', '    int displayMode = 0;', 'frame default mode')"""
          new = """display_mode_matches = cpp.count('  int displayMode = 1;')
if display_mode_matches != 2:
    raise SystemExit(f'display mode defaults: expected 2 matches, got {display_mode_matches}')
cpp = cpp.replace('  int displayMode = 1;', '  int displayMode = 0;')"""
          if old not in text:
              raise SystemExit('renderer migration assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          python3 tool/ui/apply_viewer_polish.py

          git show HEAD^:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml
          rm -f .github/workflows/ui-workspace-polish.yml
          rm -f .github/workflows/ui-workspace-polish-apply.yml
          rm -f tool/ui/apply_viewer_polish.py

          git config user.name 'BrepSight CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ui: redesign mobile model workspace'
          git push origin HEAD:release/0.1
