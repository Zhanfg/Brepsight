name: Mesh Edit Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/cad_engine/android/src/main/cpp/mesh_transform.*'
      - 'packages/cad_engine/android/src/main/cpp/mesh_writer.*'
      - 'packages/cad_engine/android/src/test/cpp/mesh_transform_test.cpp'
      - '.github/workflows/mesh-edit-core.yml'
  push:
    paths:
      - 'packages/cad_engine/android/src/main/cpp/mesh_transform.*'
      - 'packages/cad_engine/android/src/main/cpp/mesh_writer.*'
      - 'packages/cad_engine/android/src/test/cpp/mesh_transform_test.cpp'
      - '.github/workflows/mesh-edit-core.yml'

permissions:
  contents: write

jobs:
  transform-contract:
    name: Apply RC358 runtime hotfix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.1
          fetch-depth: 0
      - name: Apply runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc358_runtime_hotfix.py
          git diff --check
      - name: Commit product-only runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(android): fail fast when runtime bridge is incomplete'
          git push origin HEAD:release/0.1
