name: FCStd bridge patch

on:
  push:
    branches:
      - feat/freecad-fcstd-provider
    paths:
      - '.github/workflows/fcstd-bridge-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/freecad-fcstd-provider
          fetch-depth: 0

      - name: Patch Android bridge and native source path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          plugin_path = Path('packages/cad_engine/android/src/main/kotlin/dev/brepsight/cad_engine/CadEnginePlugin.kt')
          text = plugin_path.read_text()
          replacement = '''            "loadModel" -> loadModel(call.argument<String>("path").orEmpty(), result)
            "fitAll" ->'''
          text, count = re.subn(
              r'            "loadModel" -> \{\n.*?\n            \}\n            "fitAll" ->',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one loadModel handler block, found {count}')

          marker = '''    private fun pickerBusy(): Boolean =
'''
          helper = r'''    private fun loadModel(path: String, result: MethodChannel.Result) {
        if (path.isBlank()) {
            result.success(
                mapOf(
                    "ok" to false,
                    "displayName" to "",
                    "message" to "Document path is empty.",
                    "formatId" to "unknown",
                    "triangleCount" to 0L,
                    "hasUv" to false,
                    "hasNormals" to false,
                    "exactGeometry" to false,
                    "rootObjectCount" to 0L,
                    "hierarchyNodeCount" to 0L,
                    "readOnly" to false,
                    "recomputed" to false,
                    "errorCode" to 1000,
                )
            )
            return
        }

        val file = File(path)
        Thread {
            var prepared: FcStdPreparedArchive? = null
            try {
                val isFcStd = file.extension.equals("fcstd", ignoreCase = true)
                val nativePath = if (isFcStd) {
                    prepared = FcStdArchivePreparer.prepare(file, context.cacheDir)
                    prepared!!.manifestFile.absolutePath
                } else {
                    path
                }

                val code = nativeLoadModel(nativePath)
                val handle = if (code == 0) nativeCurrentDocumentHandle() else 0L
                val formatId = if (handle != 0L) {
                    nativeDocumentFormatId(handle) ?: "unknown"
                } else if (isFcStd) {
                    "fcstd"
                } else {
                    file.extension.lowercase()
                }
                val triangleCount = if (handle != 0L) nativeDocumentTriangleCount(handle) else 0L
                val hasUv = handle != 0L && nativeDocumentHasUv(handle)
                val hasNormals = handle != 0L && nativeDocumentHasNormals(handle)
                val exactGeometry = handle != 0L && nativeDocumentHasExactGeometry(handle)
                val rootObjectCount = if (handle != 0L) nativeDocumentRootObjectCount(handle) else 0L
                val hierarchyNodeCount = if (handle != 0L) nativeDocumentHierarchyNodeCount(handle) else 0L
                val message = if (code == 0) {
                    if (isFcStd) {
                        "OK (read-only FreeCAD saved geometry; parametric recompute disabled)"
                    } else {
                        "OK"
                    }
                } else {
                    nativeLastError().ifBlank { "Native importer failed (code=$code)" }
                }
                val response = mapOf(
                    "ok" to (code == 0),
                    "displayName" to file.name,
                    "message" to message,
                    "formatId" to formatId,
                    "triangleCount" to triangleCount,
                    "hasUv" to hasUv,
                    "hasNormals" to hasNormals,
                    "exactGeometry" to exactGeometry,
                    "rootObjectCount" to rootObjectCount,
                    "hierarchyNodeCount" to hierarchyNodeCount,
                    "readOnly" to isFcStd,
                    "recomputed" to false,
                    "errorCode" to code,
                )
                mainHandler.post { result.success(response) }
            } catch (error: FcStdRejectedException) {
                val response = mapOf(
                    "ok" to false,
                    "displayName" to file.name,
                    "message" to (error.message ?: "FCStd was rejected by the safe reader."),
                    "formatId" to "fcstd",
                    "triangleCount" to 0L,
                    "hasUv" to false,
                    "hasNormals" to false,
                    "exactGeometry" to false,
                    "rootObjectCount" to 0L,
                    "hierarchyNodeCount" to 0L,
                    "readOnly" to true,
                    "recomputed" to false,
                    "errorCode" to 1401,
                )
                mainHandler.post { result.success(response) }
            } catch (error: Throwable) {
                val response = mapOf(
                    "ok" to false,
                    "displayName" to file.name,
                    "message" to (error.message ?: "Model preparation failed."),
                    "formatId" to if (file.extension.equals("fcstd", ignoreCase = true)) "fcstd" else file.extension.lowercase(),
                    "triangleCount" to 0L,
                    "hasUv" to false,
                    "hasNormals" to false,
                    "exactGeometry" to false,
                    "rootObjectCount" to 0L,
                    "hierarchyNodeCount" to 0L,
                    "readOnly" to file.extension.equals("fcstd", ignoreCase = true),
                    "recomputed" to false,
                    "errorCode" to 1402,
                )
                mainHandler.post { result.success(response) }
            } finally {
                prepared?.workDir?.deleteRecursively()
            }
        }.start()
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('pickerBusy insertion marker not unique')
          text = text.replace(marker, helper + marker, 1)
          plugin_path.write_text(text)

          jni_path = Path('packages/cad_engine/android/src/main/cpp/cad_engine_jni.cpp')
          jni = jni_path.read_text()
          old = '  record.sourcePath = modelPath;\n'
          new = '  record.sourcePath = loaded.sourcePathOverride.empty() ? modelPath : loaded.sourcePathOverride;\n'
          if jni.count(old) != 1:
              raise SystemExit(f'expected one native sourcePath assignment, found {jni.count(old)}')
          jni = jni.replace(old, new, 1)
          jni_path.write_text(jni)
          PY

          rm .github/workflows/fcstd-bridge-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(android): bridge safe FCStd loading'
          git push origin HEAD:feat/freecad-fcstd-provider
