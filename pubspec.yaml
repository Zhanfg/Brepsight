name: brepsight
description: BrepSight mobile universal engineering and 3D document viewer, converter, and inspection toolkit.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  cad_engine:
    path: packages/cad_engine
  sensors_plus: ^6.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - THIRD_PARTY_LICENSES.md
